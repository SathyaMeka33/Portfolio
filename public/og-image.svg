<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#000000"/>
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141414" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#252525" stroke-width="1.5"/>

  <!-- Top Metadata Header -->
  <text x="80" y="95" font-family="'JetBrains Mono', monospace" font-size="14" fill="#a0a0a0" letter-spacing="4">PORTFOLIO ARCHIVE // 2026</text>
  <text x="1120" y="95" font-family="'JetBrains Mono', monospace" font-size="14" fill="#666666" text-anchor="end" letter-spacing="2">SYSTEM STATUS: OPERATIONAL</text>
  <line x1="80" y1="120" x2="1120" y2="120" stroke="#252525" stroke-width="1"/>

  <!-- Main Brand Title -->
  <text x="80" y="240" font-family="'Syne', 'Geist', sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">SATHYA MEKA</text>
  
  <!-- Subtitle Badge -->
  <rect x="80" y="275" width="480" height="34" fill="#0c0c0c" stroke="#2a2a2a" stroke-width="1"/>
  <text x="96" y="298" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#ffffff" letter-spacing="3">DATA SCIENCE • SOFTWARE ENGINEERING</text>

  <!-- Tagline / Description -->
  <text x="80" y="370" font-family="'Geist', sans-serif" font-size="22" font-weight="300" fill="#a0a0a0">
    <tspan x="80" dy="0">Algorithmic Systems · Distributed Architectures · Relational DBs</tspan>
    <tspan x="80" dy="36">Featured Case Study: Career OS (Django / MVC / SQL / AI Guidance)</tspan>
  </text>

  <!-- Footer Specs -->
  <line x1="80" y1="490" x2="1120" y2="490" stroke="#252525" stroke-width="1"/>
  <text x="80" y="530" font-family="'JetBrains Mono', monospace" font-size="13" fill="#666666">LOCATION: RAJAHMUNDRY, AP, INDIA</text>
  <text x="600" y="530" font-family="'JetBrains Mono', monospace" font-size="13" fill="#a0a0a0" text-anchor="middle">LEETCODE: 250+ PROBLEMS SOLVED</text>
  <text x="1120" y="530" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ffffff" text-anchor="end">SATHYAMEKA.DEV</text>
